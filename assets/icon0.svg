<!-- Ícone do app, 128x128.

     O SISTEMA MASCARA EM CÍRCULO, e é isso que manda no desenho: tudo que
     encosta no canto some. A versão anterior tinha o pivô do braço a 112,17
     — fora do círculo — e ele era cortado pela metade na bolha.

     Aqui o disco tem raio 48 (16 px de folga até a borda) e o braço inteiro
     cabe dentro do raio 60 que a máscara preserva. Conferido gerando o ícone,
     mascarando em círculo e olhando no tamanho REAL da bolha, ~60 px: a
     60 px, traço fino e aro fino somem, então o aro é grosso (5,5) e o
     rótulo é grande.

     Vinil continua preto — é a identidade do projeto. O que carrega o
     contraste é o ARO e o rótulo, que é onde a luz pega num disco de
     verdade. Sem canal alfa: o Vita não aceita alfa no icon0. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="r" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFE3AE"/><stop offset="0.45" stop-color="#FFAA28"/>
      <stop offset="1" stop-color="#9A5F0C"/>
    </linearGradient>
    <radialGradient id="bg" cx="32%" cy="24%" r="90%">
      <stop offset="0" stop-color="#1A2130"/><stop offset="1" stop-color="#05070C"/>
    </radialGradient>
    <radialGradient id="lab" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFE3AE"/><stop offset="0.6" stop-color="#FFAA28"/>
      <stop offset="1" stop-color="#C07E12"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- disco centrado; raio 48 deixa 16 px de folga até a borda, então a
       máscara circular do sistema (que corta os cantos) não encosta nele -->
  <g transform="translate(64,66)">
    <circle r="48" fill="#0A0D14" stroke="url(#r)" stroke-width="5.5"/>
    <g fill="none" stroke="#FFAA28" stroke-opacity="0.40" stroke-width="2.2">
      <circle r="39"/><circle r="31.5"/><circle r="24"/>
    </g>
    <circle r="15.5" fill="url(#lab)"/>
    <circle r="3.2" fill="#05070C"/>
  </g>
  <!-- braço INTEIRO dentro do círculo seguro: o pivô a 96,26 fica a 47 px do
       centro da tela, dentro do raio 60 que a máscara preserva -->
  <g stroke-linecap="round">
    <line x1="96" y1="26" x2="80" y2="50" stroke="#05070C" stroke-width="11"/>
    <line x1="96" y1="26" x2="84" y2="44" stroke="#FFE3AE" stroke-width="4.2"/>
    <line x1="84" y1="44" x2="77" y2="55" stroke="#FFAA28" stroke-width="9.5"/>
    <circle cx="96" cy="26" r="8.5" fill="#0A0D14" stroke="#FFAA28" stroke-width="3.2"/>
    <circle cx="96" cy="26" r="2.6" fill="#FFE3AE"/>
  </g>
</svg>
