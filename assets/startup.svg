<?xml version="1.0" encoding="utf-8"?>
<!-- O portão da LiveArea (280x158): é o BOTÃO que se aperta para abrir.

     O que estava errado antes: era um retângulo chapado de canto vivo,
     pousado sobre o disco do fundo sem nenhuma transição — lia como um
     recorte colado, não como um botão. E o emblema dentro dele era um
     toca-discos inteiro, o MESMO desenho que já estava gigante atrás; a
     mesma figura duas vezes na mesma tela, uma competindo com a outra.

     Agora: uma moldura interna com canto arredondado dá a ele a forma de um
     objeto, e o emblema virou só o selo — o anel e a agulha —, que é o
     recorte que sobrevive a 40 pixels. O disco inteiro fica com o fundo.

     Sem transparência de propósito: o fundo é pintado até a borda. A LiveArea
     exige PNG de paleta 8 bits, e um portão que dependesse de alfa para não
     parecer quebrado é um risco que não dá para conferir sem o aparelho. A
     moldura desenhada POR DENTRO dá a mesma leitura sem correr esse risco. -->
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="158" viewBox="0 0 280 158">
  <defs>
    <linearGradient id="chao" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#161D2B"/>
      <stop offset="0.55" stop-color="#0A0E16"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>
    <linearGradient id="moldura" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFC56B" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#FFAA28" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7A4A0E" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="aro" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFE3AE"/>
      <stop offset="0.5" stop-color="#FFAA28"/>
      <stop offset="1" stop-color="#A96A10"/>
    </linearGradient>
    <linearGradient id="lab" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFE3AE"/>
      <stop offset="1" stop-color="#D9950F"/>
    </linearGradient>
    <linearGradient id="regua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFAA28" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFAA28" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="280" height="158" fill="url(#chao)"/>
  <!-- a moldura: dá borda ao botão sem depender de alfa -->
  <rect x="5.5" y="5.5" width="269" height="147" rx="9"
        fill="none" stroke="url(#moldura)" stroke-width="2"/>
  <rect x="9" y="9" width="262" height="1" fill="#FFE3AE" fill-opacity="0.18"/>

  <!-- o selo: o anel e a agulha, sem o prato -->
  <g transform="translate(64,79)">
    <circle r="38" fill="none" stroke="url(#aro)" stroke-width="3.4"/>
    <g fill="none" stroke="#FFAA28" stroke-opacity="0.30" stroke-width="1.5">
      <circle r="30"/><circle r="23"/>
    </g>
    <circle r="14" fill="url(#lab)"/>
    <circle r="2.8" fill="#05070C"/>
    <!-- a agulha atravessa o anel: é o gesto que dá nome ao app -->
    <g stroke-linecap="round">
      <line x1="30" y1="-30" x2="8" y2="-4" stroke="#05070C" stroke-width="9"/>
      <line x1="30" y1="-30" x2="14" y2="-11" stroke="#FFE3AE" stroke-width="3.2"/>
      <line x1="14" y1="-11" x2="6" y2="-1" stroke="#FFAA28" stroke-width="7"/>
      <circle cx="30" cy="-30" r="6.5" fill="#0A0D14" stroke="#FFAA28" stroke-width="2.4"/>
    </g>
  </g>

  <text x="122" y="76" font-family="Noto Sans, DejaVu Sans, sans-serif"
        font-size="31" font-weight="700" letter-spacing="0.5" fill="#FFAA28">Stylus</text>
  <rect x="123" y="86" width="118" height="1.6" fill="url(#regua)"/>
  <text x="124" y="105" font-family="Noto Sans, DejaVu Sans, sans-serif"
        font-size="12" letter-spacing="5" fill="#98A2B4">V I N I L</text>
</svg>
