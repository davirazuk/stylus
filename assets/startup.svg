<?xml version="1.0" encoding="utf-8"?>
<!-- Portão da LiveArea (280x158): o botão que se aperta para abrir o app.
     Mesma linguagem do ícone e do deck — vinil escuro, âmbar no aro e no
     rótulo — para o app se reconhecer antes de abrir. -->
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="158" viewBox="0 0 280 158">
  <defs>
    <linearGradient id="chao" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#141A26"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>
    <linearGradient id="rotulo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFD08A"/>
      <stop offset="0.55" stop-color="#FFAA28"/>
      <stop offset="1" stop-color="#C97F14"/>
    </linearGradient>
    <linearGradient id="aro" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFE0A8"/>
      <stop offset="0.5" stop-color="#FFAA28"/>
      <stop offset="1" stop-color="#8A5C12"/>
    </linearGradient>
  </defs>

  <rect width="280" height="158" fill="url(#chao)"/>
  <rect x="0" y="0" width="280" height="2" fill="#FFAA28" fill-opacity="0.6"/>

  <g transform="translate(62,79)">
    <circle r="52" fill="#0A0D14"/>
    <circle r="52" fill="none" stroke="url(#aro)" stroke-width="2.6"/>
    <g fill="none" stroke="#FFAA28" stroke-opacity="0.28" stroke-width="1.3">
      <circle r="44"/><circle r="38"/><circle r="32"/><circle r="26"/>
    </g>
    <circle r="19" fill="url(#rotulo)"/>
    <circle r="19" fill="none" stroke="#FFE9C4" stroke-opacity="0.5" stroke-width="1.3"/>
    <circle r="3.4" fill="#05070C"/>
  </g>

  <!-- braço curto, entrando por cima -->
  <g stroke-linecap="round">
    <line x1="104" y1="20" x2="86" y2="44" stroke="#05070C" stroke-width="7"/>
    <line x1="104" y1="20" x2="89" y2="40" stroke="#FFC56B" stroke-width="2.8"/>
    <line x1="89"  y1="40" x2="84" y2="47" stroke="#FFAA28" stroke-width="6"/>
    <circle cx="104" cy="20" r="6" fill="#12161F" stroke="#FFAA28" stroke-width="2"/>
  </g>

  <text x="140" y="72" font-family="Noto Sans, DejaVu Sans, sans-serif"
        font-size="27" font-weight="700" letter-spacing="3" fill="#FFAA28">STYLUS</text>
  <text x="142" y="95" font-family="Noto Sans, DejaVu Sans, sans-serif"
        font-size="13" letter-spacing="3" fill="#7A8290">V I N I L</text>
  <rect x="142" y="107" width="80" height="2" fill="#FFAA28" fill-opacity="0.45"/>
</svg>
