<?xml version="1.0" encoding="utf-8"?>
<!-- O portão da LiveArea (280x158): é o BOTÃO que se aperta para abrir.
     Mesma linguagem do ícone e do deck. O texto fica à direita porque no
     estilo `a1` o portão aparece centrado e o disco à esquerda equilibra. -->
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="158" viewBox="0 0 280 158">
  <defs>
    <linearGradient id="chao" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1A2130"/><stop offset="1" stop-color="#05070C"/>
    </linearGradient>
    <linearGradient id="aro" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFE3AE"/><stop offset="0.45" stop-color="#FFAA28"/>
      <stop offset="1" stop-color="#9A5F0C"/>
    </linearGradient>
    <radialGradient id="lab" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFE3AE"/><stop offset="0.6" stop-color="#FFAA28"/>
      <stop offset="1" stop-color="#C07E12"/>
    </radialGradient>
  </defs>

  <rect width="280" height="158" fill="url(#chao)"/>
  <rect x="0" y="0" width="280" height="2" fill="#FFAA28" fill-opacity="0.7"/>

  <g transform="translate(62,80)">
    <circle r="50" fill="#0A0D14" stroke="url(#aro)" stroke-width="4.5"/>
    <g fill="none" stroke="#FFAA28" stroke-opacity="0.38" stroke-width="1.8">
      <circle r="41"/><circle r="33"/><circle r="25"/>
    </g>
    <circle r="16" fill="url(#lab)"/>
    <circle r="3.2" fill="#05070C"/>
  </g>
  <g stroke-linecap="round">
    <line x1="98" y1="34" x2="82" y2="58" stroke="#05070C" stroke-width="10"/>
    <line x1="98" y1="34" x2="86" y2="52" stroke="#FFE3AE" stroke-width="3.6"/>
    <line x1="86" y1="52" x2="79" y2="63" stroke="#FFAA28" stroke-width="8.5"/>
    <circle cx="98" cy="34" r="7.5" fill="#0A0D14" stroke="#FFAA28" stroke-width="2.8"/>
  </g>

  <text x="132" y="76" font-family="Noto Sans, DejaVu Sans, sans-serif"
        font-size="30" font-weight="700" letter-spacing="1" fill="#FFAA28">Stylus</text>
  <text x="134" y="99" font-family="Noto Sans, DejaVu Sans, sans-serif"
        font-size="13" letter-spacing="4" fill="#8A93A3">V I N I L</text>
  <rect x="134" y="110" width="92" height="2" fill="#FFAA28" fill-opacity="0.5"/>
</svg>
