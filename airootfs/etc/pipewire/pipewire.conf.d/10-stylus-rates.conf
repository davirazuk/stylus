# ───────────────────────────────────────────────────────────────────────────
#  STYLUS — let the graph run at the rate the file was made at
# ───────────────────────────────────────────────────────────────────────────
#  Out of the box PipeWire allows exactly one clock rate, 48000. Anything
#  that is not 48k gets resampled on the way out, and most of a record
#  collection is 44.1k: every CD rip, every FLAC bought from a store, every
#  vinyl needledrop. So on a stock install the entire collection is being
#  converted in software before it reaches the DAC, forever, silently.
#
#  Allowing the whole 44.1 and 48 family means the graph picks the rate the
#  stream actually is and the samples reach the converter untouched. It only
#  works when nothing else is holding the graph open at another rate — that
#  is a real limitation of a shared audio server, not a bug, and it is why
#  `stylus-audio` exists: it tells you the rate the graph is running at right
#  now and what is holding it there.
#
#  Check it with:  stylus-audio
# ───────────────────────────────────────────────────────────────────────────
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 ]

    # Quantum is latency, and latency is not the thing being optimised here.
    # A listening machine wants headroom against xruns far more than it wants
    # 5ms of round trip, and a big quantum is also what lets a USB converter
    # sleep between transfers instead of being woken 1500 times a second.
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 8192
}

stream.properties = {
    # When resampling genuinely cannot be avoided — two streams at different
    # rates at once — do it at the best quality the resampler has rather than
    # the default 4. It costs CPU that this machine has.
    resample.quality = 15
    # false means the resampler stays AVAILABLE, and that is deliberate — the
    # comment here used to claim the opposite of what the line does, which is
    # the kind of thing that gets "corrected" into a broken system six months
    # later. Turning the resampler off does not make anything bit-perfect: it
    # makes the second stream at a different rate fail to play at all. What
    # makes the collection reach the converter untouched is allowed-rates
    # above; this line is the honest admission that when two rates collide
    # something has to give, and quality 15 is how it gives.
    resample.disable = false
    # The two settings that actually stop the graph from touching the levels.
    channelmix.normalize = false
    channelmix.mix-lfe   = false
    # And again false = the mixer stays available. It has to: stereo into a
    # 5.1 card is a channel remap, not a level change, and disabling it would
    # silence those cards rather than purify them. "No automatic level
    # fiddling" is the two lines above, not this one.
    channelmix.disable   = false
}
