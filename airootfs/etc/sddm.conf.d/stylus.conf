[General]
DisplayServer=x11
Numlock=on

[Theme]
Current=stylus
CursorTheme=Adwaita
CursorSize=24

[Autologin]
User=stylus
# stylus.desktop is the "last chosen" dispatcher: its Exec is `stylus-session`
# with no argument, which reads ~/.config/stylus/mode and starts music or
# desktop from there. The live medium seeds that file to music.
Session=stylus.desktop
# Relogin, and it has to be on. Switching between MUSIC and DESKTOP is done by
# `stylus-mode`, which writes the mode file and EXITS the session on purpose —
# SDDM is meant to log straight back in and the new session reads the new mode,
# which is the "half a second of black and you're on the other side" the mode
# switch promises. With Relogin off, that exit lands on the greeter instead,
# asking for a password on a machine whose whole point is being used from the
# sofa with a controller. The installer strips User=/Session= from this block
# on a real install (so there is no unattended autologin there); this setting
# only governs the live medium and is inert once those are gone.
Relogin=true

[X11]
# Keep the greeter off VT1 - archiso autologins root on tty1 as a rescue console.
MinimumVT=7

[Users]
HideShells=/usr/bin/nologin,/sbin/nologin
