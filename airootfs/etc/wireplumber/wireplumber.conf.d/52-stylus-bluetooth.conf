# ───────────────────────────────────────────────────────────────────────────
#  STYLUS — bluetooth, with the codecs that are not embarrassing
# ───────────────────────────────────────────────────────────────────────────
#  Bluetooth is never bit-perfect; it is lossy by construction. That is not a
#  reason to ship the worst of the lossy options. The default codec order
#  puts SBC first, and SBC at its default bitpool is genuinely bad — audibly
#  so on anything with cymbals in it. Ordering LDAC and aptX-HD ahead of it
#  costs nothing on hardware that lacks them and is a large difference on
#  hardware that has them.
#
#  The headset profile (HSP/HFP) is left available but never auto-selected:
#  switching a pair of headphones into 16kHz mono because something opened a
#  microphone is the single most annoying thing bluetooth audio does.
# ───────────────────────────────────────────────────────────────────────────
monitor.bluez.properties = {
  bluez5.enable-sbc-xq  = true
  bluez5.enable-msbc    = true
  bluez5.enable-hw-volume = true
  bluez5.roles          = [ a2dp_sink a2dp_source bap_sink bap_source ]
  bluez5.codecs         = [ ldac aptx_hd aptx aac sbc_xq sbc ]
  bluez5.default.rate   = 48000
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        bluez5.auto-connect  = [ a2dp_sink ]
        device.profile       = "a2dp-sink"
        bluez5.a2dp.ldac.quality = "hq"
      }
    }
  }
]
