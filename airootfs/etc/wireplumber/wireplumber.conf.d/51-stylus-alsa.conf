# ───────────────────────────────────────────────────────────────────────────
#  STYLUS — ALSA devices are allowed to change rate
# ───────────────────────────────────────────────────────────────────────────
#  Allowing rates in pipewire.conf is only half of it. WirePlumber opens the
#  ALSA device, and unless the device node itself is told it may switch, it
#  is opened once at the default rate and stays there — so the graph "allows"
#  44.1k and never actually uses it.
#
#  api.alsa.multirate lets one device carry streams of different rates by
#  reopening at the right one when it can. This rule is deliberately matched
#  on ALL alsa sinks rather than on one named card: a distribution has to be
#  right on a stranger's DAC, not only on the author's.
# ───────────────────────────────────────────────────────────────────────────
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        audio.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 ]
        api.alsa.multirate  = true
        # Let the device keep its own period sizing rather than forcing a
        # figure that suits a laptop speaker onto an outboard converter.
        api.alsa.disable-batch = false
        # Do not hold the device open when nothing is playing. A converter
        # that is released can be reopened at the next file's rate; one held
        # open at 48k will resample the 44.1k track that follows.
        session.suspend-timeout-seconds = 5
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_input.*" } ]
    actions = {
      update-props = {
        audio.allowed-rates = [ 44100 48000 88200 96000 192000 ]
        api.alsa.multirate  = true
      }
    }
  }
]
