# ─────────────────────────────────────────────────────────────────────────────
#  STYLUS — picom with animations.
#
#  Everything in picom.conf, plus movement. This is a separate file rather than
#  a block in the main one because launch.sh only uses it on machines with a
#  real GPU. On the software-rendered fallback every frame of an animation is
#  drawn on the CPU, which on the low-end hardware this distribution is aimed at
#  turns a nicety into a stutter - those machines keep picom.conf and get an
#  instant, still desktop instead.
#
#  Presets and trigger names come from picom v12. An older picom ignores an
#  option it does not know rather than refusing to start, so this stays safe on
#  a machine whose picom is behind - it simply animates nothing.
# ─────────────────────────────────────────────────────────────────────────────

@include "picom.conf"

# Durations are short on purpose. Anything past about a fifth of a second stops
# reading as responsiveness and starts reading as waiting, and this is a
# desktop people use between classes.
animations = (
    # A new window - an application starting, or the launcher opening - fades
    # up from slightly small rather than snapping into place.
    {
        triggers = ["open"];
        preset   = "appear";
        duration = 0.18;
        scale    = 0.94;
    },

    # Switching workspace in i3 unmaps the windows on the one you left and maps
    # the ones on the one you arrived at, so "show" and "hide" are what make a
    # workspace change animate rather than cut.
    {
        triggers = ["show"];
        preset   = "appear";
        duration = 0.16;
        scale    = 0.97;
    },
    {
        triggers = ["close", "hide"];
        preset   = "disappear";
        duration = 0.14;
        scale    = 0.96;
    },

    # Tiling: when a window opens or closes, i3 resizes its neighbours. Without
    # this they jump to their new size, which is the single thing that makes
    # tiling feel abrupt.
    {
        triggers = ["geometry"];
        preset   = "geometry-change";
        duration = 0.16;
    }
)
