# STYLUS — picom compositor
# i3 launches `picom -b`, which previously ran with no configuration at all.

backend = "glx";
vsync = true;
use-damage = true;

# ── Get out of the way of fullscreen games ───────────────────────────────────
#  picom defaults this to false, which means a fullscreen game goes on being
#  composited: every frame the game draws is copied through the compositor
#  before it reaches the screen. That costs a frame of latency, a second vsync
#  on top of the game's own - so the two fight and the result stutters - and
#  GPU time on a machine that has none to spare. On the hardware this
#  distribution exists for it is the difference between a Unity game running
#  and a Unity game being unplayable, and nothing about it is visible: the
#  frame counter simply reads low and the mouse feels late.
#
#  With this on, picom stops redirecting as soon as a window covers the screen
#  and hands it straight to the hardware. It goes back to compositing the
#  moment anything else appears.
unredir-if-possible = true;
#  ...except for these. A video player that is merely fullscreen still wants
#  the compositor for tear-free playback, and unredirecting a notification
#  makes it flash.
unredir-if-possible-exclude = [
    "class_g = 'Dunst'"
];

#  Fullscreen windows get no shadow and no corner rounding either. Both are
#  work done on something whose edges are off the screen, and the rounding in
#  particular forces a shader over the whole window every frame.

# ── Rounded corners ──────────────────────────────────────────────────────────
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g = 'Polybar'",
    "class_g = 'i3-frame'",
    "fullscreen"
];

# ── Shadows ──────────────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'i3-frame'",
    # ":c" is not decoration. Without a type suffix picom cannot tell what kind
    # of property this is - "Target type cannot be determined" - and it does
    # not skip the rule, it refuses the whole configuration and exits 1. The
    # compositor then never starts: no rounded corners, no shadows, no fading,
    # and nothing on screen to say why, because launch.sh execs it and it dies
    # immediately. _GTK_FRAME_EXTENTS is a CARDINAL, hence c.
    "_GTK_FRAME_EXTENTS@:c",
    "fullscreen"
];

# ── Fading ───────────────────────────────────────────────────────────────────
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

# ── Transparency ─────────────────────────────────────────────────────────────
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "92:class_g = 'Alacritty' && focused",
    "86:class_g = 'Alacritty' && !focused",
    "95:class_g = 'Polybar'"
];

# ── Misc ─────────────────────────────────────────────────────────────────────
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

wintypes:
{
    tooltip      = { fade = true; shadow = false; opacity = 0.95; focus = true; };
    dock         = { shadow = false; };
    dnd          = { shadow = false; };
    popup_menu   = { opacity = 0.96; };
    dropdown_menu = { opacity = 0.96; };
};
