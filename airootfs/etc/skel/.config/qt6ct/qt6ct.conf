[Appearance]
# Without custom_palette the style's own palette is used, and Fusion's is
# light. The shipped configuration set a dark icon theme next to a light
# window and nothing here ever switched the colours over.
custom_palette=true
color_scheme_path=/usr/share/qt6ct/colors/stylus.conf
icon_theme=Papirus-Dark
standard_dialogs=default
style=Fusion

[Interface]
cursor_flash_time=1000
double_click_interval=400
menus_have_icons=true
