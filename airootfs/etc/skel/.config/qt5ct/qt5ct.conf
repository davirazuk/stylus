[Appearance]
# Without custom_palette the style's own palette is used, and Fusion's is
# light. The shipped configuration set a dark icon theme next to a light
# window and nothing here ever switched the colours over.
custom_palette=true
color_scheme_path=/usr/share/qt5ct/colors/stylus.conf
icon_theme=Papirus-Dark
standard_dialogs=default
style=Fusion

[Fonts]
fixed=@Variant(\0\0\0@\0\0\0\x16JetBrainsMono Nerd Font\0\0\0\n\0\0\0\0\x32\x7f\0\0\x18)
general=@Variant(\0\0\0@\0\0\0\x12Noto Sans\0\0\0\n\0\0\0\0\x28\x7f\0\0\x14)
