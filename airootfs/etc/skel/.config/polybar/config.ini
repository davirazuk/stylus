; ═══════════════════════════════════════════════════════════════════════════
;  STYLUS — polybar v2
;
;  Barra flutuante com cantos arredondados, fundo translúcido e ícones Nerd
;   principal à esquerda, relógio + status à direita, disco no centro.
;   Segue a paleta INK (#07080b) com âmbar como cor viva — §5.5 do CLAUDE.md.
; ═══════════════════════════════════════════════════════════════════════════

[colors]
; Paleta INK — preto frio + âmbar como ÚNICA cor viva.
; Os valores são os de /usr/share/stylus/palette, e o tools/check.sh confere.
; Antes daqui cada um tinha derivado um pouco do da tela cheia — o texto era
; #e8ecf5 aqui e #e8ecf5 lá, o azul #5bcefa aqui e #5bcefa lá. Diferenças que
; ninguém vê lado a lado, e é por isso que passaram: o efeito não é uma cor
; errada, é a barra e a tela cheia parecerem de sistemas diferentes.
; O bg leva um cc na frente: é a transparência da barra, não outra cor.
bg         = #cc07080b
bg-solid   = #07080b
surface    = #101219
surface-hi = #1a1e28
fg         = #e8ecf5
fg-dim     = #8a95aa
fg-muted   = #768094
amber      = #f0a030
amber-dim  = #c08020
lav        = #b7a0ff
cyan       = #5bcefa
green      = #7ed99e
yellow     = #ffc850
red        = #ee7a82
blue       = #5bcefa

; ─── Barra principal ─────────────────────────────────────────────────────

[bar/main]
monitor          = ${env:MONITOR:}
monitor-strict   = false
width            = 96%
width-max        = 1800
offset-x         = 2%
offset-y         = 0.8%
height           = ${env:STYLUS_BAR_HEIGHT:36}
dpi              = ${env:STYLUS_BAR_DPI:0}
radius           = 12
fixed-center     = true

background       = ${colors.bg}
foreground       = ${colors.fg}

line-size        = 2
line-color       = ${colors.amber}
border-size      = 0
border-color     = ${colors.surface}

padding-left     = 1
padding-right    = 1
padding-top      = 0
padding-bottom   = 0
module-margin    = 1

; Fontes: Nerd Font para ícones, JetBrainsMono para texto
font-0           = JetBrainsMono Nerd Font:size=11;3
font-1           = JetBrainsMono Nerd Font:size=14;4
font-2           = JetBrainsMono Nerd Font:size=9;3

; O `webdav` e o `xwindow` existiam escritos aqui embaixo e não estavam em
; NENHUMA destas três linhas: dois módulos prontos, testados, e que a barra
; nunca desenhou. O do celular é o que dói — ele acende quando o aparelho
; está montado e diz quantas pastas vieram, que é a única confirmação visual
; de que o `stylus webdav` deu certo. Os dois somem sozinhos quando não há o
; que dizer (o script devolve linha vazia; o xwindow tem `label-empty`).
modules-left     = menu sep-l ws xwindow
modules-center  = sep-c album lyric sep-c2
modules-right   = musicmode media sep-r webdav volume network powerprofile battery bluetooth notifications date power

cursor-click     = pointer
cursor-scroll    = ns-resize
enable-ipc       = true
wm-restack       = i3

; ─── Separadores ─────────────────────────────────────────────────────────

[module/sep-l]
type = custom/text
content = "  "
foreground = ${colors.amber-dim}

[module/sep-r]
type = custom/text
content = "  "
foreground = ${colors.amber-dim}

[module/sep-c]
type = custom/text
content = "   "
foreground = ${colors.fg-muted}

[module/sep-c2]
type = custom/text
content = "   "
foreground = ${colors.fg-muted}

; ─── Menu (launcher) ─────────────────────────────────────────────────────

[module/menu]
type              = custom/text
format            = <label>
label             = " 󰍜 "
format-font       = 2
format-foreground = ${colors.amber}
format-background = ${colors.surface}
format-padding    = 1
click-left        = stylus-ui
click-right       = rofi -show drun

; ─── i3 workspaces ───────────────────────────────────────────────────────

[module/ws]
type                       = internal/i3
format                     = <label-state>
index-sort                 = true
wrapping-scroll            = false
enable-click               = true
enable-scroll              = true
pin-workspaces             = true

label-focused              = %index%
label-focused-foreground   = ${colors.bg-solid}
label-focused-background   = ${colors.amber}
label-focused-underline    = ${colors.amber}
label-focused-padding      = 1

label-unfocused            = %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding    = 1

label-visible              = %index%
label-visible-foreground   = ${colors.fg-muted}
label-visible-padding      = 1

label-urgent               = %index%
label-urgent-foreground    = ${colors.bg-solid}
label-urgent-background    = ${colors.red}
label-urgent-padding       = 1

; ─── Janela focada ───────────────────────────────────────────────────────

; Sem `format-prefix`: o que havia ali eram dois ESPAÇOS, não um ícone. Um
; prefixo em branco com cor própria parece um ícone que não carregou — e o
; `module-margin` já dá a folga. O título some sozinho quando não há janela
; (`label-empty`), que é o estado do modo MÚSICA.
[module/xwindow]
type             = internal/xwindow
label            = %title%
label-maxlen     = 32
label-empty      =
label-foreground = ${colors.fg-dim}

; ─── Relógio ──────────────────────────────────────────────────────────────

[module/date]
type             = internal/date
interval         = 5
date             = %a %d %b
time             = %H:%M
label            = " %date%  %time% "
label-foreground = ${colors.fg}
; 󰃭 nf-md-calendar. Aqui havia um ESPAÇO com cor de ícone: o cabeçalho deste
; arquivo promete "ícones Nerd" e três módulos internos desenhavam um vão em
; branco no lugar do ícone — os de script trazem o deles de dentro, os
; internos não têm de onde tirar. Ver também o volume, logo abaixo.
format-prefix     = "󰃭 "
format-prefix-foreground = ${colors.fg-muted}

; ─── Disco (album position) ──────────────────────────────────────────────

[module/album]
type          = custom/script
exec          = python3 ~/.config/polybar/scripts/album.py
tail          = true
format-prefix = "  "
format-foreground = ${colors.amber}
click-left    = stylus-deck &
click-right   = stylus-shelf &

; ─── Letra ────────────────────────────────────────────────────────────────

[module/lyric]
type        = custom/script
exec        = python3 ~/.config/polybar/scripts/lyric.py
tail        = true
format-foreground = ${colors.fg-dim}
click-left  = rofi -e "$(stylus lyrics --print 2>/dev/null)" &

; ─── Modo MÚSICA ──────────────────────────────────────────────────────────

[module/musicmode]
type                = custom/text
format              = <label>
label               = " 󰲾 "
label-foreground    = ${colors.lav}
format-background   = ${colors.surface}
format-padding      = 1
click-left          = stylus-mode music &

; ─── Mídia (tocando agora) ───────────────────────────────────────────────

[module/media]
type              = custom/script
exec              = ~/.config/polybar/scripts/media.sh
tail              = true
exec-if           = command -v playerctl
click-left        = ~/.config/polybar/scripts/media.sh toggle
scroll-up         = ~/.config/polybar/scripts/media.sh next
scroll-down       = ~/.config/polybar/scripts/media.sh prev
format-foreground = ${colors.fg-dim}
format-prefix     = "  "
format-prefix-foreground = ${colors.fg-muted}

; ─── Volume ───────────────────────────────────────────────────────────────

[module/volume]
type                     = internal/pulseaudio
; O ícone acompanha o NÍVEL. Antes o prefixo era um par de espaços — um
; "ícone" invisível — e o do mudo era o mesmo par de espaços pintado de
; vermelho: o aviso mais importante da barra existia como uma cor sem forma.
; Num sistema cuja tese é ouvir, saber que a saída está muda tem que ser
; visível de relance, não uma palavra em cinza no meio de outras.
format-volume            = <ramp-volume> <label-volume>
ramp-volume-0            = 󰕿
ramp-volume-1            = 󰖀
ramp-volume-2            = 󰕾
; Mobília, não estado especial: o lavanda da paleta é "especial" e o volume
; não é — ele muda o dia inteiro. O vermelho do mudo logo abaixo é que é
; informação, e ele só aparece quando há o que dizer.
ramp-volume-foreground   = ${colors.fg-muted}
label-volume             = %percentage%%
label-volume-foreground  = ${colors.fg-dim}
format-muted-prefix      = "󰖁 "
format-muted-prefix-foreground = ${colors.red}
label-muted              = mudo
label-muted-foreground   = ${colors.fg-dim}
click-left               = pamixer -t
click-right              = pavucontrol
scroll-up                = pamixer -i 5
scroll-down              = pamixer -d 5

; ─── Rede ─────────────────────────────────────────────────────────────────

[module/network]
type              = custom/script
exec              = ~/.config/polybar/scripts/network.sh
interval          = 5
format-foreground = ${colors.fg-dim}
format-prefix     = " "
format-prefix-foreground = ${colors.fg-muted}
click-left        = ~/.config/rofi/network-menu.sh
click-right       = nm-connection-editor

; ─── Perfil de energia ────────────────────────────────────────────────────

[module/powerprofile]
type              = custom/script
exec              = ~/.config/polybar/scripts/power-profile.sh
click-left        = ~/.config/polybar/scripts/power-profile.sh --cycle
exec-if           = command -v powerprofilesctl
tail              = true
format-foreground = ${colors.fg-dim}
format-prefix     = " "
format-prefix-foreground = ${colors.fg-muted}

; ─── Bateria ──────────────────────────────────────────────────────────────

[module/battery]
type              = custom/script
exec              = ~/.config/polybar/scripts/battery.sh
exec-if           = test -n "$(ls -d /sys/class/power_supply/BAT* 2>/dev/null)"
interval          = 20
format-foreground = ${colors.fg-dim}
format-prefix     = " "
format-prefix-foreground = ${colors.fg-muted}

; ─── Bluetooth ────────────────────────────────────────────────────────────

[module/bluetooth]
type              = custom/script
exec              = ~/.config/polybar/scripts/bluetooth.sh
exec-if           = test -n "$(ls -A /sys/class/bluetooth 2>/dev/null)"
interval          = 15
format-foreground = ${colors.fg-dim}
format-prefix     = " "
format-prefix-foreground = ${colors.fg-muted}
click-left        = ~/.config/rofi/bluetooth-menu.sh
click-right       = blueman-manager

; ─── Notificações ─────────────────────────────────────────────────────────

[module/notifications]
type              = custom/script
exec              = ~/.config/polybar/scripts/notifications.sh
tail              = true
exec-if           = command -v dunstctl
format-foreground = ${colors.fg-dim}
format-prefix     = " "
format-prefix-foreground = ${colors.fg-muted}
click-left        = ~/.config/rofi/notifications.sh
click-right       = ~/.config/polybar/scripts/notifications.sh --toggle

; ─── WebDAV (celular) ─────────────────────────────────────────────────────

[module/webdav]
type           = custom/script
exec           = ~/.config/polybar/scripts/webdav.sh
interval       = 10
format-foreground = ${colors.fg-dim}
format-prefix     = " "
format-prefix-foreground = ${colors.fg-muted}
click-left     = stylus webdav &

; ─── Power (desligar) ────────────────────────────────────────────────────

[module/power]
type              = custom/text
format            = <label>
label             = " 󰐥 "
label-foreground  = ${colors.red}
format-background = ${colors.surface}
format-padding    = 1
click-left        = ~/.config/rofi/powermenu.sh
