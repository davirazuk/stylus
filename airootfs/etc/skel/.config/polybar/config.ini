; ─────────────────────────────────────────────────────────────────────────────
;  STYLUS — polybar
;
;  Uma barra só, quase-preta, com a capa do disco como única coisa colorida
;  por perto — a mesma direção da interface em tela cheia. Ícones coloridos e
;  texto apagado direto na barra, sem caixa por módulo; os dois únicos botões
;  (menu e MÚSICA) levam fundo porque são botões, não leituras.
;
;  O ORÇAMENTO DE COLUNAS é a regra que manda aqui. A barra tem largura fixa e
;  a polybar não corta nada: quando a soma dos módulos passa da tela, o que
;  passa SIMPLESMENTE SAI PARA FORA — foi o vazamento antigo (data e desligar
;  sumirem quando a letra vinha longa). Contagem atual no pior caso realista,
;  em colunas de fonte monoespaçada tamanho 10:
;
;    esquerda  menu 4 + i3 ~20 + janela ≤30          ≈ 54
;    centro    disco ~30 + letra ≤34                 ≈ 64
;    direita   música 12 + mídia ≤30 + relógio 17
;              + rede 14 + volume 11 + perfil 7
;              + bateria 9 + bt 6 + sino 5 + sair 5  ≈ 116
;
;    total     ≈ 234 — cabe em 1920 (≈250 col) e sobra pouco. Por isso cada
;    módulo novo precisa pagar a própria coluna: se você acrescenta um, corte
;    outro. cpu e memória saíram da barra por essa conta — eram métrica de
;    desenvolvimento numa máquina de ouvir música; voltam comentadas abaixo.
; ─────────────────────────────────────────────────────────────────────────────

[colors]
; bg era "#ee7a821d": lido como RRGGBBAA dá salmão a 11% de alpha — o papel
; de parede atravessava e a barra inteira ficava amarelo-sujo. É o INK da
; interface (#07080b) com alpha ee.
bg        = #07080bee
bg-solid  = #07080b
surface   = #0d0f14
fg        = #e2e7f0
fg-dim    = #7e899c
accent    = #5bcefa
lav       = #b7a0ff
cyan      = #7fd7ff
green     = #7ed99e
yellow    = #f0bd76
red       = #f5a9b8

[bar/main]
; Filled in by launch.sh, which starts one bar per connected output. Empty
; means "whatever polybar considers primary", which is the single-screen case
; and the fallback if the monitor list cannot be read.
monitor          = ${env:MONITOR:}
monitor-strict   = false
; Flush and full width. i3 reserves the bar's height as a strut, so an offset
; only pushes the gap off-screen and rounded corners never show - a clean
; edge-to-edge bar reads better than a floating one that is not really
; floating.
width            = 100%
; Set by stylus-scale through launch.sh: 32 on an ordinary screen, taller on a
; high-density one.
height           = ${env:STYLUS_BAR_HEIGHT:32}
; Font sizes are in points; polybar turns points into pixels with this.
; Scaling the bar means setting the DPI, not rewriting each font line - polybar
; does NOT expand ${env:...} inside font-N, it hands the literal string to the
; font parser, which fails, and then the whole bar exits: "Could not parse
; font". 0 means ask the X server.
dpi              = ${env:STYLUS_BAR_DPI:0}
offset-x         = 0
offset-y         = 0
radius           = 0
background       = ${colors.bg}
foreground       = ${colors.fg}
line-size        = 0
padding          = 2
; Dois de margem entre módulos: um colava leitura de botão (o sino encostado
; no relógio lia como um módulo só). Respirar é hierarquia.
module-margin    = 2
separator        =
separator-foreground = ${colors.surface}
; Font order matters twice over. Polybar tries them left to right for every
; character, so font-0 must be the text font; and `format-font` indices are
; 1-based - `format-font = 2` means font-1, not font-2.
;
; The icons are Font Awesome 4.7 codepoints in the basic private use area,
; carried by both fonts below - JetBrainsMono Nerd Font patches them in and
; otf-font-awesome ships them natively. Two sources for the same glyph is
; deliberate: a codepoint no installed font has draws as a hollow box, and a
; bar full of boxes looks broken in a way blank space does not. The status
; scripts use the Material Design range instead, which only the Nerd Font has;
; they are already guarded by exec-if.
font-0           = JetBrainsMono Nerd Font:size=10;3
font-1           = JetBrainsMono Nerd Font:size=14;4
font-2           = Font Awesome 6 Free:style=Solid:size=10;3
font-3           = Noto Color Emoji:scale=10;3
modules-left     = menu i3 xwindow
modules-center   = album lyric
; A mídia lidera o cluster direito: nome de faixa é muito mais largo que um
; ícone, e no meio dos status ela empurraria todo mundo a cada música.
modules-right    = musicmode media volume network powerprofile battery bluetooth notifications webdav date power
; Sem tray. nm-applet e blueman-applet continuam subindo pelo i3 e fazendo o
; trabalho de verdade (agente de segredo, agente de pareamento, reconectar);
; a barra já tem módulo próprio para rede e bluetooth, e a tray mostrava os
; mesmos dois ícones duas vezes, lado a lado. Para devolver:
;   tray-position  = right
;   tray-padding   = 6
;   tray-maxsize   = 18
cursor-click     = pointer
enable-ipc       = true
border-size      = 0
wm-restack       = i3

[module/menu]
type              = custom/text
format            = "  "
; 1-based: font-1, a de 14 — o botão maior que tudo ao redor, porque é a
; coisa da barra que se aperta de propósito.
format-font       = 2
format-foreground = ${colors.accent}
format-background = ${colors.surface}
format-padding    = 2
click-left        = stylus-ui
click-right       = rofi -show drun

[module/i3]
type                       = internal/i3
format                     = <label-state> <label-mode>
index-sort                 = true
wrapping-scroll            = false
enable-click               = true
enable-scroll              = true
; Cada barra lista só as workspaces do próprio monitor — clicar um número na
; barra errada não joga mais a workspace para a outra tela.
pin-workspaces             = true
label-mode                 = %mode%
label-mode-padding         = 2
label-mode-background      = ${colors.accent}
label-mode-foreground      = ${colors.bg-solid}

label-focused              = %index%
label-focused-foreground   = ${colors.bg-solid}
label-focused-background   = ${colors.accent}
label-focused-padding      = 2

label-unfocused            = %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding    = 2

label-visible              = %index%
label-visible-foreground   = ${colors.accent}
label-visible-padding      = 2

label-urgent               = %index%
label-urgent-foreground    = ${colors.bg-solid}
label-urgent-background    = ${colors.red}
label-urgent-padding       = 2

; What is focused. i3 tabs new windows, so the tab bar names them - but a
; single window on a workspace has no tab bar at all, and a fullscreen one
; covers it, so this is the only place that says what you are looking at.
; 30 e não 48: era o maior vilão do orçamento da esquerda, e título que vale
; um relógio fora da tela é troca ruim.
[module/xwindow]
type             = internal/xwindow
label            = %title%
label-maxlen     = 30
label-empty      =
label-foreground = ${colors.fg-dim}

[module/date]
type             = internal/date
interval         = 5
; Uma linha só: dia-da-semana curto, dia, mês, hora. O ícone de calendário
; custava quatro colunas para dizer nada que "qua 12 mar" não diga.
date             = %a %d %b
time             = %H:%M
label            = %{F#7e899c}%date%%{F#e2e7f0}  %time%%{F-}

; ── o disco ─────────────────────────────────────────────────────────────────
; Onde você está NO DISCO — lado, faixa, quanto falta para ter que virar. É a
; informação que um álbum dá e um tocador não. Os dois módulos do centro são
; tail scripts: imprimem só quando mudam, e truncam nos próprios scripts
; (album.py e lyric.py) porque é ali que se conhece o orçamento.
[module/album]
type          = custom/script
exec          = python3 ~/.config/polybar/scripts/album.py
tail          = true
format-prefix = " "
click-left    = stylus-deck &
click-right   = stylus-shelf &

; A linha que está sendo cantada agora. Metade encarte, metade karaokê.
[module/lyric]
type        = custom/script
exec        = python3 ~/.config/polybar/scripts/lyric.py
tail        = true
click-left  = rofi -e "$(stylus lyrics --print 2>/dev/null)" &

; Voltar ao modo música — o botão do Steam Deck ao contrário.
[module/musicmode]
type                = custom/text
; Glifo + palavra: glifo sozinho numa barra cheia de glifos não se lê como
; botão, e ninguém descobre por sorte que aquilo leva de volta à música.
format              = <label>
label               = " 󰲾 MÚSICA "
label-background    = ${colors.surface}
label-foreground    = ${colors.lav}
click-left          = stylus-mode music &

; ── status ──────────────────────────────────────────────────────────────────
# What is playing. Left click pauses, the scroll wheel skips. Absent entirely
# when nothing is playing, so it costs no bar space when it has nothing to
# show. Truncation lives in media.sh (MAX) because that script knows the
# right-hand budget.
[module/media]
type              = custom/script
# tail, not interval: the script blocks on playerctl --follow and prints only
# when something changes. Polling this every two seconds started playerctl
# around ninety times a minute on a machine usually playing nothing.
exec              = ~/.config/polybar/scripts/media.sh
tail              = true
# Nothing to follow without playerctl, so the script is never started.
exec-if           = command -v playerctl
click-left        = ~/.config/polybar/scripts/media.sh toggle
scroll-up         = ~/.config/polybar/scripts/media.sh next
scroll-down       = ~/.config/polybar/scripts/media.sh prev
format-foreground = ${colors.fg-dim}

[module/volume]
type                     = internal/pulseaudio
format-volume-prefix     = "  "
format-volume-prefix-foreground = ${colors.lav}
label-volume             = %percentage%%
label-volume-foreground  = ${colors.fg-dim}
format-muted-prefix      = "  "
format-muted-prefix-foreground = ${colors.red}
label-muted              = mudo
label-muted-foreground   = ${colors.fg-dim}
; Clicking a speaker icon mutes it, through pamixer, which the profile
; installs - so this does not depend on pactl arriving as somebody else's
; dependency.
click-left               = pamixer -t
click-right              = pavucontrol

; Reports whichever interface is actually carrying traffic - wired or wireless
; - and says "offline" when nothing is up.
[module/network]
type              = custom/script
exec              = ~/.config/polybar/scripts/network.sh
interval          = 5
format-foreground = ${colors.fg-dim}
# Pick a network and join it. The editor is still one entry inside the menu,
# for the rare case that someone needs to edit a profile rather than connect.
click-left        = ~/.config/rofi/network-menu.sh
click-right       = nm-connection-editor

# The power profile. Click cycles it.
[module/powerprofile]
type              = custom/script
exec              = ~/.config/polybar/scripts/power-profile.sh
click-left        = ~/.config/polybar/scripts/power-profile.sh --cycle
# tail, not interval. Polled every thirty seconds, the bar kept showing the old
# profile for up to half a minute after a click - long enough to click again
# thinking nothing had happened. The script listens for the daemon's
# PropertiesChanged signal, which carries the new profile with it.
exec-if           = command -v powerprofilesctl
tail              = true
format-foreground = ${colors.fg-dim}

; Prints nothing at all when the machine has no battery.
[module/battery]
type              = custom/script
exec              = ~/.config/polybar/scripts/battery.sh
# A desktop has no battery and never will; the script already printed nothing
# there, but it was still being started three times a minute to do it.
exec-if           = test -n "$(ls -d /sys/class/power_supply/BAT* 2>/dev/null)"
interval          = 20
format-foreground = ${colors.fg-dim}

[module/bluetooth]
type              = custom/script
exec              = ~/.config/polybar/scripts/bluetooth.sh
# Nothing to poll if there is no adapter.
exec-if           = test -n "$(ls -A /sys/class/bluetooth 2>/dev/null)"
interval          = 15
format-foreground = ${colors.fg-dim}
# Paired devices, connecting on Enter. blueman is inside the menu for pairing
# something new, which needs a PIN agent this has no business reimplementing.
click-left        = ~/.config/rofi/bluetooth-menu.sh
click-right       = blueman-manager

# The bell. A notification that times out is gone: everything the machine has
# to say appears for eight seconds in a corner and then exists nowhere. This
# keeps the count and puts the history one click away.
[module/notifications]
type              = custom/script
exec              = ~/.config/polybar/scripts/notifications.sh
# tail, not interval: dunst emits PropertiesChanged the moment a notification
# arrives, is dismissed or the pause state flips.
tail              = true
exec-if           = command -v dunstctl
format-foreground = ${colors.fg-dim}
click-left        = ~/.config/rofi/notifications.sh
# Silence, without opening anything. The bell turns yellow while it lasts.
click-right       = ~/.config/polybar/scripts/notifications.sh --toggle

[module/power]
type              = custom/text
format            = "  "
format-foreground = ${colors.red}
click-left        = ~/.config/rofi/powermenu.sh

; Métricas de desenvolvimento, fora da barra por causa do orçamento de
; colunas (ver o cabeçalho deste arquivo). Para devolver, acrescente cpu e
; memory em modules-right e descomente:
;[module/cpu]
;type                     = internal/cpu
;interval                 = 2
;format-prefix            = "  "
;format-prefix-foreground = ${colors.fg-dim}
;label                    = %percentage:2%%
;label-foreground         = ${colors.fg-dim}
;
;[module/memory]
;type                     = internal/memory
;interval                 = 3
;format-prefix            = "  "
;format-prefix-foreground = ${colors.fg-dim}
;label                    = %percentage_used:2%%
;label-foreground         = ${colors.fg-dim}

[module/webdav]
type           = custom/script
exec           = ~/.config/polybar/scripts/webdav.sh
interval       = 10
format-foreground = ${colors.fg-dim}
click-left     = stylus webdav &
