# ─────────────────────────────────────────────────────────────────────────────
#  Bound the journal.
#
#  systemd sizes the journal as a proportion of whatever it is stored on:
#  SystemMaxUse defaults to 10% of the filesystem, capped at 4 GiB, and
#  RuntimeMaxUse to 10% of RAM. Nothing was set here, so an installed machine
#  gave the journal 10% of its disk for as long as it ran - about 3 GiB on the
#  32 GiB eMMC laptops schools buy, on a system whose base install is around
#  eight. It is not a leak, it is the documented default, and it is a poor
#  trade on a small disk.
#
#  200 MiB is weeks of logs on a desktop machine, and is what a student would
#  ever be asked to look at. The journal is not the place a school laptop
#  should be spending gigabytes.
#
#  RuntimeMaxUse matters on the live medium, where journald.conf.d/
#  volatile-storage.conf puts the journal in RAM: 10% of a 2 GiB machine is
#  200 MiB of memory spent on logs during a session where memory is the scarce
#  thing. The same number, meant differently.
# ─────────────────────────────────────────────────────────────────────────────

[Journal]
SystemMaxUse=200M
RuntimeMaxUse=64M
# One file per boot rather than one enormous rotating file, so `journalctl -b -1`
# after a crash reads a bounded amount.
MaxFileSec=1week
