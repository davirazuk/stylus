# ─────────────────────────────────────────────────────────────────────────────
#  Compressed swap in RAM.
#
#  STYLUS runs on school machines, which means old machines: four gigabytes of
#  memory and, often, a spinning disk. The installer already creates a swap
#  file, but swapping to a mechanical disk is the difference between a slow
#  computer and an unusable one - the machine stops responding for seconds at a
#  time while a student is in the middle of something.
#
#  zram is swap held in RAM, compressed. Pages that would have gone to the disk
#  get squeezed into a fraction of the memory they occupied instead, which
#  costs a little CPU and saves the disk round trip entirely. Fedora, Ubuntu,
#  ChromeOS and Android all default to it now, for exactly this hardware.
#
#  The generator gives this device swap priority 100, and a swap file gets a
#  much lower one, so the kernel fills zram first and only touches the disk
#  once zram is full. The disk swap file stays as the overflow.
#
#  The compression algorithm is deliberately left at the kernel default
#  (lzo-rle). zstd compresses better but costs noticeably more CPU per page,
#  and on the machines this exists for the CPU is the scarce thing.
# ─────────────────────────────────────────────────────────────────────────────

[zram0]
# Half of RAM, never more than 4 GiB. Stated rather than left implicit: it
# happens to be the generator's own default, but a default is not a decision.
zram-size = min(ram / 2, 4096)
