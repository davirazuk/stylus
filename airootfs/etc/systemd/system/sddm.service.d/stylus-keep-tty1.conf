# Live medium only.
#
# sddm.service ships Conflicts=getty@tty1.service, so starting the greeter stops
# archiso's autologin root console on tty1. On installed systems that is the
# right behaviour, but on install media that console is the rescue path when the
# desktop does not come up - and it is what the motd tells you to use.
#
# An empty assignment resets the list. The greeter is pinned to VT7 by
# MinimumVT in /etc/sddm.conf.d/stylus.conf, so nothing competes for tty1.
[Unit]
Conflicts=
