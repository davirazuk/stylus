# ─────────────────────────────────────────────────────────────────────────────
#  Keep one cached version of each package instead of three.
#
#  paccache.timer is enabled by the installer, and pacman-contrib's service runs
#  `paccache -r`, which keeps the three most recent versions of every package
#  in /var/cache/pacman/pkg. On a rolling release that cache is the single
#  largest thing on the disk after a few months of updates - several gigabytes,
#  most of it versions nobody will install again.
#
#  One version is kept because that is what a downgrade actually needs: the
#  package you are running now. Anything older can be fetched again, and on a
#  machine where the disk is the scarce resource - which is most of them here -
#  that is the right trade.
#
#  ExecStart is cleared first: a drop-in appends to the list otherwise, and the
#  original `paccache -r` would still run alongside this one.
# ─────────────────────────────────────────────────────────────────────────────

[Service]
ExecStart=
ExecStart=/usr/bin/paccache -r -k1
# Uninstalled packages are worth nothing at all; -u removes every cached
# version of anything no longer on the system.
ExecStart=/usr/bin/paccache -r -u -k0
