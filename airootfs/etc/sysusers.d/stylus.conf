# The live user itself is declared statically in /etc/passwd + /etc/shadow so it
# can have a known password. What it could never have that way is a matching
# *group*: /etc/group is owned by the filesystem package and must not be
# replaced wholesale, or every system group (wheel, audio, video, ...) would be
# lost. So the group and the supplementary memberships are declared here and
# created by systemd-sysusers - both at ISO build time (pacman hook) and at boot.
g stylus 1000
m stylus wheel
m stylus audio
m stylus video
m stylus input
m stylus storage
m stylus optical
m stylus network
m stylus lp
m stylus scanner
m stylus rfkill
m stylus sys
m stylus uucp
