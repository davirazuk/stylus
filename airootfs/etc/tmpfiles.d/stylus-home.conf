# Materialise the live user's home from /etc/skel.
#
# mkarchiso copies airootfs into the image *before* pacstrap runs, so /etc/skel
# is already in place when the systemd-tmpfiles pacman hook fires - the home
# directory is baked into the squashfs. The same rules re-run at every boot
# against the writable overlay, so the live session is self-healing even if the
# user nukes their home.
C /home/stylus 0750 stylus stylus - /etc/skel
Z /home/stylus - stylus stylus -
