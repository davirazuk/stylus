<!-- Stylus Kvantum Theme — amber soul, crushed black -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .bg { fill: #07080b; }
      .hl { fill: #1a1e28; }
      .accent { fill: #f0a030; }
      .text { fill: #e8ecf5; }
      .faint { fill: #768094; }
      .line { fill: #343a48; }
      .amber-dim { fill: #c08020; }
    </style>
  </defs>

  <!-- Window background -->
  <rect class="bg" width="64" height="64" rx="8"/>

  <!-- Panel -->
  <rect class="hl" x="2" y="2" width="60" height="60" rx="6" fill-opacity="0.5"/>

  <!-- Button -->
  <rect class="hl" x="8" y="8" width="48" height="20" rx="4"/>
  <rect class="accent" x="8" y="26" width="48" height="3" rx="1.5" fill-opacity="0.6"/>

  <!-- Scrollbar -->
  <rect class="line" x="56" y="8" width="4" height="48" rx="2"/>
  <rect class="accent" x="56" y="16" width="4" height="16" rx="2" fill-opacity="0.8"/>

  <!-- Progress bar -->
  <rect class="line" x="8" y="36" width="48" height="4" rx="2"/>
  <rect class="accent" x="8" y="36" width="32" height="4" rx="2"/>

  <!-- Menu item hover -->
  <rect class="hl" x="4" y="44" width="56" height="16" rx="3" fill-opacity="0.8"/>
</svg>
