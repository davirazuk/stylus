; STYLUS — a paleta dos aplicativos Qt (qt5ct e qt6ct leem o mesmo arquivo).
;
; POR QUE ESTE ARQUIVO FOI REESCRITO
; ----------------------------------
; A ordem desta lista é a do enum QPalette::ColorRole, e a que estava aqui
; punha as cores nos papéis errados. Escrito por extenso:
;
;   WindowText = #07080b   ← a MESMA cor de Window: todo rótulo de todo
;                            aplicativo Qt era preto sobre preto. Invisível.
;   Base       = #f0a030   ← o fundo de campo de texto, lista e tabela em
;                            ÂMBAR CHAPADO, com o Text em cinza (#8a95aa)
;                            por cima. Ilegível.
;   Link e LinkVisited em âmbar — a §5.5 diz que o azul é informação e o
;   lavanda é o especial; o âmbar é a seleção, e só ela.
;   E as três linhas (active/disabled/inactive) eram IDÊNTICAS, então um
;   botão desligado tinha exatamente a cara de um ligado.
;
; Ninguém vê isso lendo o arquivo — são vinte cores sem nome, numa ordem que
; só o Qt conhece. Vê-se abrindo um aplicativo Qt no modo música.
;
; A ordem, para o próximo que mexer:
;   WindowText Button Light Midlight Dark Mid Text BrightText ButtonText
;   Base Window Shadow Highlight HighlightedText Link LinkVisited
;   AlternateBase NoRole ToolTipBase ToolTipText
;
; Mexeu aqui? Mexa no /usr/share/stylus/palette também, e rode o check.sh.
[ColorScheme]
active_colors=#ffe8ecf5, #ff1a1e28, #ff343a48, #ff2a2d36, #ff04060a, #ff101219, #ffe8ecf5, #ffffc850, #ffe8ecf5, #ff07080b, #ff07080b, #ff04060a, #fff0a030, #ff07080b, #ff5bcefa, #ffb7a0ff, #ff101219, #ff07080b, #ff101219, #ffe8ecf5
disabled_colors=#ff768094, #ff1a1e28, #ff343a48, #ff2a2d36, #ff04060a, #ff101219, #ff768094, #ff768094, #ff768094, #ff07080b, #ff07080b, #ff04060a, #ff1a1e28, #ff768094, #ff5bcefa, #ffb7a0ff, #ff101219, #ff07080b, #ff101219, #ff768094
inactive_colors=#ffe8ecf5, #ff1a1e28, #ff343a48, #ff2a2d36, #ff04060a, #ff101219, #ffe8ecf5, #ffffc850, #ffe8ecf5, #ff07080b, #ff07080b, #ff04060a, #ffc08020, #ff07080b, #ff5bcefa, #ffb7a0ff, #ff101219, #ff07080b, #ff101219, #ffe8ecf5
